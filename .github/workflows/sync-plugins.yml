name: Sync Codex and Cursor Plugins

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync skills and versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          buckets=(productivity engineering)
          for bucket in "${buckets[@]}"; do
            skill_dirs=("skills/${bucket}"/*/)
            if ((${#skill_dirs[@]} == 0)); then
              echo "No skill directories found under skills/${bucket}." >&2
              exit 1
            fi
            rm -rf "plugins/${bucket}/skills"
            mkdir -p "plugins/${bucket}/skills"
            cp -a "${skill_dirs[@]}" "plugins/${bucket}/skills/"
          done

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          for (const bucket of ["productivity", "engineering"]) {
            const manifestPath = `plugins/${bucket}/.codex-plugin/plugin.json`;
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            manifest.version = version;
            writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Commit synchronized plugins
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- plugins/productivity plugins/engineering)" ]; then
            echo "Plugin artifacts are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- plugins/productivity plugins/engineering
          git commit -m "chore: sync Codex and Cursor plugins"
          git push origin HEAD:master
